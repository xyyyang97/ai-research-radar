name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # README documents Python 3.11+

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy src/ai_research_radar

      - name: Unit & integration tests
        run: pytest

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Smoke — CLI works end-to-end without credentials
        env:
          RADAR_LLM_PROVIDER: none
          RADAR_ALLOW_PRIVATE: "1"
        run: |
          radar sources
          radar export-prompts --dir /tmp/prompts-check
