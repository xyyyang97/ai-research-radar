name: scheduled-radar-run

# Runs the radar on a schedule and commits generated reports back to the repo.
#
# Setup after pushing:
#   1. Settings → Actions → General → Workflow permissions:
#      allow "Read and write permissions" (needed to commit reports).
#   2. Optional: add repository secrets for any LLM provider keys or a
#      GITHUB_TOKEN with higher rate limits. The job works with none.
#   3. Adjust the cron below (UTC!) to your taste.

on:
  schedule:
    - cron: "30 22 * * *"   # daily 22:30 UTC — change me
  workflow_dispatch: {}      # manual trigger button

permissions:
  contents: write

concurrency:
  group: radar-run
  cancel-in-progress: false

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run radar pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_LLM_PROVIDER: ${{ secrets.RADAR_LLM_PROVIDER || 'none' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_COMPATIBLE_BASE_URL: ${{ secrets.OPENAI_COMPATIBLE_BASE_URL }}
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
        run: radar run

      - name: Commit reports (if changed)
        run: |
          git config user.name "radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "radar: daily report $(date -u +%F)"
            git push
          fi
